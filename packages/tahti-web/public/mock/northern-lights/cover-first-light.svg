<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">First Light EP cover</title>
  <desc id="description">Abstract northern lights crossing a dark winter sky</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#32175c"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#22d3ee"/>
      <stop offset="0.62" stop-color="#86efac"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#sky)"/>
  <circle cx="930" cy="215" r="94" fill="#eefcff" opacity=".92"/>
  <path d="M-100 560C160 260 370 740 650 390S1040 260 1320 470" fill="none" stroke="url(#aurora)" stroke-width="150" opacity=".42" filter="url(#glow)"/>
  <path d="M-100 520C160 220 370 700 650 350S1040 220 1320 430" fill="none" stroke="url(#aurora)" stroke-width="54" opacity=".9"/>
  <path d="M0 925 235 720 390 835 575 650 770 830 930 700 1200 930V1200H0Z" fill="#030712" opacity=".9"/>
  <g fill="#f8fafc">
    <text x="70" y="1000" font-family="system-ui, sans-serif" font-size="108" font-weight="800" letter-spacing="-3">FIRST LIGHT</text>
    <text x="76" y="1072" font-family="system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="10" opacity=".75">NORTHERN LIGHTS · EP</text>
  </g>
</svg>
