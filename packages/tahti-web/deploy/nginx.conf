# Nuclear × Tahti web (beta) — static SPA + public API proxy
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Without this, nginx resolves api.tahti.live's IP once at container
    # startup and caches it for the process lifetime -- if that IP later
    # changes (CDN rotation, host migration), every proxied request hangs
    # forever instead of failing fast, since nginx keeps dialing the dead
    # IP. 127.0.0.11 is Docker Compose's embedded per-network DNS, which
    # forwards to the host's real resolvers. Requires a variable (not a
    # literal host) in proxy_pass below for this to actually take effect.
    resolver 127.0.0.11 valid=30s;
    set $tahti_api_upstream api.tahti.live;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sitemap-profiles.xml {
        proxy_pass https://$tahti_api_upstream/api/sitemap/profiles.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
    }

    location = /sitemap-releases.xml {
        proxy_pass https://$tahti_api_upstream/api/sitemap/releases.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
    }

    # Same-origin API → public Tahti API (cookies work; CORS not needed for same origin)
    location ^~ /tahti-api/ {
        proxy_pass https://$tahti_api_upstream/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain api.tahti.live $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Optional: also expose /api for absolute paths some clients use
    location ^~ /api/ {
        proxy_pass https://$tahti_api_upstream/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain api.tahti.live $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:svg|png|jpe?g|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
